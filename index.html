<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open MIDI Piano</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">&#9835;</span>
        <h1>Open MIDI Piano</h1>
      </div>
      <div class="header-controls">
        <div class="control-group">
          <label>音色</label>
          <select id="sound-mode">
            <option value="synth">合成器 (即时)</option>
            <option value="sf" selected>SoundFont (高品质)</option>
          </select>
        </div>
        <div class="control-group">
          <label>音量</label>
          <input type="range" id="volume" min="0" max="100" value="70">
        </div>
        <div class="sf-status" id="sf-status">
          <span class="status-dot loading"></span>
          <span id="sf-status-text">正在加载音色库...</span>
        </div>
      </div>
    </header>

    <main class="app-main">
      <aside class="sidebar">
        <div class="panel songs-panel">
          <h2>曲谱库</h2>
          <ul id="song-list" class="song-list"></ul>
        </div>
      </aside>

      <section class="piano-section">
        <div class="piano-container" id="piano-container">
          <div class="piano" id="piano"></div>
        </div>
        <div class="player-bar" id="player-bar">
          <div class="player-bar-top">
            <span class="note-display" id="note-display">按下琴键开始演奏</span>
            <span id="progress-text">0:00 / 0:00</span>
          </div>
          <div class="progress-bar" id="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="player-controls">
            <button id="btn-stop" class="btn" disabled>&#9198;</button>
            <button id="btn-toggle" class="btn btn-primary" disabled>&#9654; 播放</button>
            <div class="control-group tempo-control">
              <span id="tempo-value">100</span>%
              <input type="range" id="tempo" min="25" max="200" value="100">
            </div>
          </div>
        </div>
      </section>

      <aside class="instrument-panel" id="instrument-panel">
        <h3 class="instrument-panel-title">乐器</h3>
        <div class="instrument-icons" id="instrument-icons"></div>
      </aside>
    </main>
  </div>

  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <h2>Open MIDI Piano</h2>
      <p id="loading-text">正在初始化音频引擎...</p>
      <div class="loading-progress">
        <div class="loading-progress-bar" id="loading-progress-bar"></div>
      </div>
      <p class="loading-hint">首次加载音色库可能需要几秒钟</p>
    </div>
  </div>

  <script type="module" src="js/app.js?v=3d7"></script>
</body>
</html>
