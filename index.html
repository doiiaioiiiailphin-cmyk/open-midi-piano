<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open MIDI Piano</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">&#9835;</span>
        <h1>Open MIDI Piano</h1>
      </div>
      <div class="header-controls">
        <div class="control-group">
          <label>音色</label>
          <select id="sound-mode">
            <option value="synth">合成器 (即时)</option>
            <option value="sf" selected>SoundFont (高品质)</option>
          </select>
        </div>
        <div class="sf-status" id="sf-status">
          <span class="status-dot loading"></span>
          <span id="sf-status-text">正在加载音色库...</span>
        </div>
      </div>
    </header>

    <main class="app-main">
      <aside class="sidebar">
        <div class="panel songs-panel">
          <div class="songs-panel-header">
            <h2>曲谱库</h2>
            <button class="btn-add-song" id="btn-add-song" title="添加 MIDI 文件">+</button>
          </div>
          <ul id="song-list" class="song-list"></ul>
        </div>
      </aside>

      <section class="piano-section">
        <div class="piano-container" id="piano-container">
          <div class="piano" id="piano"></div>
        </div>
        <div class="mac-player-bar" id="player-bar">
          <div class="progress-row">
            <span class="time-display" id="time-current">0:00</span>
            <div class="progress-bar-container">
              <div class="progress-bar" id="progress-bar">
                <div class="progress-fill" id="progress-fill">
                  <div class="progress-thumb"></div>
                </div>
              </div>
            </div>
            <span class="time-display" id="time-total">0:00</span>
            <span id="progress-text" style="display: none;">0:00 / 0:00</span>
            <span id="note-display" style="display: none;"></span>
          </div>

          <div class="controls-row">
            <div class="controls-left">
              <svg class="icon-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
              <input type="range" id="volume" class="volume-slider" min="0" max="100" value="70">
            </div>

            <div class="controls-center">
              <button class="control-btn" id="btn-prev">
                <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg>
              </button>
              <button class="control-btn play-btn" id="btn-toggle" disabled>
                <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
              </button>
              <button class="control-btn" id="btn-next">
                <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
              </button>
              <button id="btn-stop" style="display: none;"></button>
            </div>

            <div class="controls-right">
            </div>
          </div>
        </div>
      </section>

      <aside class="instrument-panel" id="instrument-panel">
        <h3 class="instrument-panel-title">乐器</h3>
        <div class="instrument-icons" id="instrument-icons"></div>
      </aside>
    </main>

  <div id="upload-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <h2>添加 MIDI 曲目</h2>
      <div class="modal-field">
        <label>曲目名称</label>
        <input type="text" id="upload-name" placeholder="例如：我的曲子">
      </div>
      <div class="modal-field">
        <label>MIDI 文件</label>
        <div class="file-picker" id="file-picker">
          <span id="file-picker-text">点击选择 .mid 文件</span>
          <input type="file" id="upload-file" accept=".mid,.midi">
        </div>
      </div>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="upload-cancel">取消</button>
        <button class="modal-btn confirm" id="upload-confirm">添加</button>
      </div>
    </div>
  </div>

  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <h2>Open MIDI Piano</h2>
      <p id="loading-text">正在初始化音频引擎...</p>
      <div class="loading-progress">
        <div class="loading-progress-bar" id="loading-progress-bar"></div>
      </div>
      <p class="loading-hint">首次加载音色库可能需要几秒钟</p>
    </div>
  </div>

  <script type="module" src="js/app.js?v=final"></script>
  <script>document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>e.preventDefault());</script>
</body>
</html>
