<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open MIDI Piano - Mac Style</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div class="mac-window">
    <div class="mac-titlebar">
      <div class="mac-dots">
        <span class="dot close"></span>
        <span class="dot minimize"></span>
        <span class="dot maximize"></span>
      </div>
    </div>

    <div class="mac-content">
      <div class="piano-showcase">
        <div id="piano-container">
          <div id="piano"></div>
        </div>
      </div>
      
      <div class="song-details">
        <h2 id="current-song-title">Open MIDI Piano</h2>
        <p id="current-song-artist">请从右下角列表选择曲目</p>
      </div>
    </div>

    <div class="mac-player-bar">
      <div class="progress-row">
        <span class="time-display" id="time-current">0:00</span>
        <div class="progress-bar-container">
          <div class="progress-bar" id="progress-bar">
            <div class="progress-fill" id="progress-fill">
              <div class="progress-thumb"></div>
            </div>
          </div>
        </div>
        <span class="time-display" id="time-total">0:00</span>
        <span id="progress-text" style="display: none;">0:00 / 0:00</span>
        <span id="note-display" style="display: none;"></span>
      </div>

      <div class="controls-row">
        <div class="controls-left">
          <svg class="icon-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
          <input type="range" id="volume" class="volume-slider" min="0" max="100" value="70">
        </div>

        <div class="controls-center">
          <button class="control-btn" id="btn-prev">
            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg>
          </button>
          <button class="control-btn play-btn" id="btn-toggle" disabled>
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          </button>
          <button class="control-btn" id="btn-next">
            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
          </button>
          <button id="btn-stop" style="display: none;"></button>
        </div>

        <div class="controls-right">
          <button class="icon-btn" id="toggle-instruments" title="乐器控制">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
          </button>
          <button class="icon-btn" id="toggle-settings" title="设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </button>
          <button class="icon-btn" id="toggle-playlist" title="曲谱库">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Drawers -->
  <div class="drawers-container">
    <div id="playlist-drawer" class="drawer hidden">
      <div class="drawer-header">
        <h2>曲谱库</h2>
        <button class="close-drawer">&times;</button>
      </div>
      <ul id="song-list" class="song-list"></ul>
    </div>

    <div id="instrument-drawer" class="drawer hidden">
      <div class="drawer-header">
        <h2>乐器静音控制</h2>
        <button class="close-drawer">&times;</button>
      </div>
      <div class="instrument-icons" id="instrument-icons"></div>
    </div>

    <div id="settings-drawer" class="drawer hidden">
      <div class="drawer-header">
        <h2>设置</h2>
        <button class="close-drawer">&times;</button>
      </div>
      <div class="settings-content">
        <div class="control-group">
          <label>音色引擎</label>
          <select id="sound-mode">
            <option value="synth">合成器 (即时)</option>
            <option value="sf" selected>SoundFont (高品质)</option>
          </select>
        </div>
        <div class="control-group tempo-control">
          <label>播放速度: <span id="tempo-value">100</span>%</label>
          <input type="range" id="tempo" min="25" max="200" value="100">
        </div>
        <div class="sf-status" id="sf-status">
          <span class="status-dot loading"></span>
          <span id="sf-status-text">正在加载音色库...</span>
        </div>
      </div>
    </div>
  </div>

  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <h2>加载中...</h2>
      <p id="loading-text">正在初始化音频引擎...</p>
      <div class="loading-progress">
        <div class="loading-progress-bar" id="loading-progress-bar"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js?v=5"></script>
</body>
</html>
