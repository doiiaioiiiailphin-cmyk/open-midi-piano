name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: node -e "const fs=require('fs');fs.mkdirSync('dist/js',{recursive:true});fs.mkdirSync('dist/css',{recursive:true});fs.mkdirSync('dist/assets',{recursive:true});fs.copyFileSync('index.html','dist/index.html');fs.readdirSync('js').forEach(f=>fs.copyFileSync('js/'+f,'dist/js/'+f));fs.readdirSync('css').forEach(f=>fs.copyFileSync('css/'+f,'dist/css/'+f))"
      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: node -e "const fs=require('fs');fs.mkdirSync('dist/js',{recursive:true});fs.mkdirSync('dist/css',{recursive:true});fs.mkdirSync('dist/assets',{recursive:true});fs.copyFileSync('index.html','dist/index.html');fs.readdirSync('js').forEach(f=>fs.copyFileSync('js/'+f,'dist/js/'+f));fs.readdirSync('css').forEach(f=>fs.copyFileSync('css/'+f,'dist/css/'+f))"
      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm install
      - run: node -e "const fs=require('fs');fs.mkdirSync('dist/js',{recursive:true});fs.mkdirSync('dist/css',{recursive:true});fs.mkdirSync('dist/assets',{recursive:true});fs.copyFileSync('index.html','dist/index.html');fs.readdirSync('js').forEach(f=>fs.copyFileSync('js/'+f,'dist/js/'+f));fs.readdirSync('css').forEach(f=>fs.copyFileSync('css/'+f,'dist/css/'+f))"
      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
